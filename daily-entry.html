<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Sales Entry - Golder Tours & Travels</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        .report-container {
            max-width: 900px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }
        .report-header h2 {
            font-size: 22px;
            color: #333;
        }
        .report-header h2 span {
            color: #28a745;
        }
        .action-btns-group {
            display: flex;
            gap: 10px;
        }
        .nav-btns a, .action-btn {
            background: #007bff;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
            display: inline-block;
        }
        .nav-btns a:hover, .action-btn:hover {
            background: #0056b3;
        }
        .action-btn.delete-btn {
            background: #dc3545;
        }
        .action-btn.delete-btn:hover {
            background: #c82333;
        }
        .controls-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: space-between;
        }
        .controls-row select, .controls-row input {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        table.report-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        table.report-table th, table.report-table td {
            border: 1px solid #e0e0e0;
            padding: 10px 12px;
            text-align: center;
            font-size: 14px;
        }
        table.report-table th {
            background-color: #f8f9fa;
            color: #333;
            font-weight: 600;
        }
        table.report-table input, table.report-table select {
            width: 100%;
            padding: 6px;
            border: 1px solid #ddd;
            border-radius: 4px;
            text-align: center;
        }
        .delete-row-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
        .delete-row-btn:hover {
            background: #c82333;
        }
        .summary-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <header>
        <div class="container navbar" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 0;">
            <div class="logo">
                <img src="logo.png" alt="Golder Tours & Travels Logo" style="max-height: 50px;">
            </div>
            <nav class="nav-btns">
                <a href="sales-report.html">View Monthly Report &rarr;</a>
            </nav>
        </div>
    </header>

    <div class="report-container">
        <div class="report-header">
            <h2>Golder Tours & Travels - <span>Daily Sales Entry (2026)</span></h2>
            <div class="action-btns-group">
                <button class="action-btn delete-btn" onclick="clearDailyData()">Delete All Saved Data</button>
                <button class="action-btn" onclick="saveDailyData()">Save Daily Entries</button>
            </div>
        </div>

        <div class="controls-row">
            <div>
                <label for="entryMonth"><strong>Select Month:</strong></label>
                <select id="entryMonth" onchange="loadDailyData()">
                    <option value="January">January 2026</option>
                    <option value="February">February 2026</option>
                    <option value="March">March 2026</option>
                    <option value="April">April 2026</option>
                    <option value="May">May 2026</option>
                    <option value="June">June 2026</option>
                    <option value="July">July 2026</option>
                    <option value="August">August 2026</option>
                    <option value="September" selected>September 2026</option>
                    <option value="October">October 2026</option>
                    <option value="November">November 2026</option>
                    <option value="December">December 2026</option>
                </select>
            </div>
            <button class="action-btn" style="background: #28a745;" onclick="addRow()">+ Add New Sale Entry</button>
        </div>

        <table class="report-table" id="dailyTable">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Product / Service</th>
                    <th>Client / Details</th>
                    <th>Sale Amount (৳)</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="dailyTableBody">
                <!-- Dynamic Rows -->
            </tbody>
        </table>

        <div class="summary-box">
            <span>Total Entries Amount for this Month:</span>
            <span id="totalDailySum" style="color: #28a745; font-size: 18px;">৳0</span>
        </div>

        <div style="text-align: right;">
            <a href="sales-report.html" class="action-btn" style="background: #17a2b8;">Go to Monthly Report to Check Summary</a>
        </div>
    </div>

    <script>
        const services = ["Umrah", "Air Ticket", "Hotel", "Umrah Visa (Only)", "Global Visa", "Transport"];

        function addRow(date = '', service = 'Umrah', details = '', amount = '') {
            const tbody = document.getElementById("dailyTableBody");
            const tr = document.createElement("tr");

            let serviceOptions = services.map(s => `<option value="${s}" ${s === service ? 'selected' : ''}>${s}</option>`).join('');

            tr.innerHTML = `
                <td><input type="date" class="row-date" value="${date}"></td>
                <td><select class="row-service">${serviceOptions}</select></td>
                <td><input type="text" class="row-details" placeholder="Client Name / Remarks" value="${details}"></td>
                <td><input type="number" class="row-amount" value="${amount}" oninput="calculateDailyTotal()"></td>
                <td><button class="delete-row-btn" onclick="removeRow(this)">Delete</button></td>
            `;
            tbody.appendChild(tr);
            calculateDailyTotal();
        }

        function removeRow(btn) {
            btn.closest('tr').remove();
            calculateDailyTotal();
            // রো ডিলিট করার পর সাথে সাথে সেভ ও আপডেট করে দেবো যাতে মান্থলি রিপোর্টে ইফেক্ট পড়ে
            saveDailyDataSilently();
        }

        function calculateDailyTotal() {
            let total = 0;
            document.querySelectorAll(".row-amount").forEach(input => {
                total += parseFloat(input.value) || 0;
            });
            document.getElementById("totalDailySum").innerText = '৳' + total.toLocaleString();
        }

        function collectTableData() {
            const rows = [];
            let serviceTotals = { "Umrah": 0, "Air Ticket": 0, "Hotel": 0, "Umrah Visa (Only)": 0, "Global Visa": 0, "Transport": 0 };

            document.querySelectorAll("#dailyTableBody tr").forEach(tr => {
                const date = tr.querySelector(".row-date").value;
                const service = tr.querySelector(".row-service").value;
                const details = tr.querySelector(".row-details").value;
                const amount = parseFloat(tr.querySelector(".row-amount").value) || 0;

                rows.push({ date, service, details, amount });
                if(serviceTotals[service] !== undefined) {
                    serviceTotals[service] += amount;
                }
            });
            return { rows, serviceTotals };
        }

        function saveDailyData() {
            const month = document.getElementById("entryMonth").value;
            const data = collectTableData();

            localStorage.setItem('golder_daily_entries_' + month, JSON.stringify(data.rows));
            localStorage.setItem('golder_auto_sales_' + month, JSON.stringify(data.serviceTotals));

            alert("Daily sales saved successfully for " + month + " 2026! Monthly report updated.");
        }

        // রো ডিলিট করার সময় স্বয়ংক্রিয়ভাবে ব্যাকগ্রাউন্ডে ডাটা আপডেট করার জন্য
        function saveDailyDataSilently() {
            const month = document.getElementById("entryMonth").value;
            const data = collectTableData();

            localStorage.setItem('golder_daily_entries_' + month, JSON.stringify(data.rows));
            localStorage.setItem('golder_auto_sales_' + month, JSON.stringify(data.serviceTotals));
        }

        function clearDailyData() {
            const month = document.getElementById("entryMonth").value;
            if (confirm("Are you sure you want to delete all daily entries and reset Actual Sales for " + month + " 2026?")) {
                localStorage.removeItem('golder_daily_entries_' + month);
                localStorage.removeItem('golder_auto_sales_' + month);

                document.getElementById("dailyTableBody").innerHTML = "";
                addRow('', 'Umrah', '', '');
                calculateDailyTotal();
                alert("All saved daily data deleted successfully for " + month + " 2026!");
            }
        }

        function loadDailyData() {
            const month = document.getElementById("entryMonth").value;
            const saved = localStorage.getItem('golder_daily_entries_' + month);
            const tbody = document.getElementById("dailyTableBody");
            tbody.innerHTML = "";

            if (saved) {
                const rows = JSON.parse(saved);
                if (rows.length > 0) {
                    rows.forEach(r => {
                        addRow(r.date, r.service, r.details, r.amount);
                    });
                } else {
                    addRow('', 'Umrah', '', '');
                }
            } else {
                addRow('', 'Umrah', '', '');
            }
            calculateDailyTotal();
        }

        window.onload = function() {
            loadDailyData();
        };
    </script>
</body>
</html>
