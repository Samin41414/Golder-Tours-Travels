<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Costing Data - Golder Tours & Travels</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #f4f9f9; padding: 20px; color: #1e272e; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: #00a8cc; margin-bottom: 20px; text-align: center; }
        
        .form-group { margin-bottom: 15px; }
        label { font-weight: 600; display: block; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; }
        
        .btn-submit { background: #2d7a42; color: white; border: none; padding: 12px 25px; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; font-size: 1rem; transition: 0.3s; margin-top: 10px; }
        .btn-submit:hover { background: #00a8cc; }

        /* Modal Overlay for Auto-Generated Receipt */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border: 2px solid #00a8cc;
        }

        .close-cross {
            position: absolute;
            top: 12px; right: 18px;
            font-size: 28px;
            font-weight: bold;
            color: #e74c3c;
            cursor: pointer;
            transition: 0.2s;
        }
        .close-cross:hover { transform: scale(1.2); color: #c0392b; }

        .popup-receipt-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00a8cc; padding-bottom: 10px; margin-bottom: 15px; }
        .popup-receipt-header img { height: 50px; }
        .popup-title { text-align: right; color: #ff7e37; font-size: 1.2rem; font-weight: bold; }
        
        .receipt-info { font-size: 0.9rem; margin-bottom: 15px; line-height: 1.6; }
        .receipt-info span { font-weight: bold; color: #00a8cc; }

        .modal-btn { background: #00a8cc; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; margin-top: 15px; width: 100%; }
        .modal-btn:hover { background: #2d7a42; }

        @media print {
            body * { visibility: hidden; }
            .modal-content, .modal-content * { visibility: visible; }
            .modal-content { position: absolute; left: 0; top: 0; width: 100%; border: 1px solid #000; }
            .close-cross, .modal-btn { display: none !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Costing Data Sheet</h2>
    <form id="costingForm" onsubmit="handleFormSubmit(event)">
        <div class="form-group">
            <label>Project / Tour Name:</label>
            <input type="text" id="projectName" placeholder="e.g. Cox's Bazar Tour Package" required>
        </div>
        <div class="form-group">
            <label>Customer Name:</label>
            <input type="text" id="clientName" placeholder="Customer Name" required>
        </div>
        <div class="form-group">
            <label>Total Cost Amount (BDT):</label>
            <input type="number" id="totalCost" placeholder="15000" required>
        </div>
        <div class="form-group">
            <label>Payment Method:</label>
            <select id="payMethod">
                <option value="Cash">Cash</option>
                <option value="bKash">bKash</option>
                <option value="Bank Transfer">Bank Transfer</option>
            </select>
        </div>
        <button type="submit" class="btn-submit">Save Costing & Auto-Generate Receipt</button>
    </form>
</div>

<!-- Receipt Popup Modal -->
<div class="modal-overlay" id="receiptModal">
    <div class="modal-content">
        <!-- Cross Button -->
        <span class="close-cross" onclick="closeModal()">&times;</span>
        
        <div class="popup-receipt-header">
            <img src="logo.png" alt="Golder Logo">
            <div class="popup-title">ONLINE RECEIPT</div>
        </div>

        <div class="receipt-info">
            <p><strong>Receipt No:</strong> <span id="popNo"></span></p>
            <p><strong>Date:</strong> <span id="popDate"></span></p>
            <p><strong>Customer:</strong> <span id="popClient"></span></p>
            <p><strong>Project Details:</strong> <span id="popProject"></span></p>
            <p><strong>Total Amount:</strong> <span id="popAmount"></span> BDT</p>
            <p><strong>Payment Mode:</strong> <span id="popMethod"></span></p>
        </div>

        <button class="modal-btn" onclick="window.print()">Print / Save PDF (For Mail)</button>
    </div>
</div>

<script>
    function handleFormSubmit(e) {
        e.preventDefault();

        // 1. Get Values
        let project = document.getElementById('projectName').value;
        let client = document.getElementById('clientName').value;
        let cost = document.getElementById('totalCost').value;
        let method = document.getElementById('payMethod').value;
        let receiptNo = "GTT-" + Math.floor(1000 + Math.random() * 9000);
        let today = new Date().toLocaleDateString();

        // 2. Populate Popup
        document.getElementById('popNo').innerText = receiptNo;
        document.getElementById('popDate').innerText = today;
        document.getElementById('popClient').innerText = client;
        document.getElementById('popProject').innerText = project;
        document.getElementById('popAmount').innerText = parseFloat(cost).toLocaleString('en-IN');
        document.getElementById('popMethod').innerText = method;

        // 3. Display Modal
        document.getElementById('receiptModal').style.display = 'flex';
    }

    // Close Modal via Cross (❌) Button
    function closeModal() {
        document.getElementById('receiptModal').style.display = 'none';
        document.getElementById('costingForm').reset();
    }
</script>

</body>
</html>
